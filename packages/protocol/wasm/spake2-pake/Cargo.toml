[package]
name = "spake2-pake"
version = "0.1.0"
edition = "2021"
description = "SPAKE2 PAKE WASM bindings for AgentPair"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spake2 = { version = "0.4", default-features = false, features = ["getrandom"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
