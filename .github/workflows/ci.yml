name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/protocol/wasm/spake2-pake

      - uses: taiki-e/install-action@b70bc27ceba992c21a34d18af7aa36f5d672e19d # wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck relay
        run: pnpm --filter @agentpair/relay typecheck

      # pretest also runs `pnpm build`; second compile is fast when artifacts exist
      - name: Verify golden fixtures are fresh
        run: pnpm --filter @agentpair/protocol run verify-fixtures

      - name: Test
        run: pnpm test

      - name: Verify npm consumer install
        run: bash scripts/verify-npm-consumer.sh
